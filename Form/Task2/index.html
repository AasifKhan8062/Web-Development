<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
  </head>
  <body>
    <section>
      <h1>Pizza Order From</h1>
      <form action="" border="1px solid black">
        <div>
          <label for="firstName">First Name:</label>
          <input
            type="text"
            name="firstName"
            id="firstName"
            placeholder="Enter First Name"
          />
        </div>
        <div>
          <label for="lastName">Last Name:</label>
          <input
            type="text"
            name="lastName"
            id="lastName"
            placeholder="Enter Last Name"
          />
        </div>
        <div>
          <label for="email"> Email ID:</label>
          <input
            type="text"
            name="email"
            id="email"
            placeholder="Enter Email ID"
          />
        </div>
        <div>
          <label for="contentNumber"> Content Number:</label>
          <input
            type="text"
            name="contentNumber"
            id="contentNumber"
            placeholder="Enter Content Number"
          />
        </div>
        <div>
          <label for="PreferredDelivaryDate">Preferred Delivary Date</label>
          <input
            type="date"
            name="PreferredDelivaryDate"
            id="PreferredDelivaryDate"
          />
        </div>
        <div>
          <label for="size">Size:</label>
          <input type="radio" name="size" id="small" value="small" />Small
          <input type="radio" name="size" id="medium" value="medium" />Medium
          <input type="radio" name="size" id="large" value="large" />Large
        </div>
        <p>Flavor:</p>
        <div>
          <input
            type="checkbox"
            name="hawaiion"
            id="hawaiion"
            value="hawaiion"
          />
          <label for="hawaiion">Hawaiion</label>
          <select name="hawaiion" id="hawaiion">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
        <div>
          <input
            type="checkbox"
            name="pepperoni"
            id="pepperoni"
            value="pepperoni"
          />
          <label for="pepperoni">Pepperoni</label>
          <select name="pepperoni" id="pepperoni">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
        <div>
          <input
            type="checkbox"
            name="vegatable"
            id="vegatable"
            value="vegatable"
          />
          <label for="vegatable">Vegatable</label>
          <select name="vegatable" id="vegatable">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
        <div>
          <label for="creditcard">Credit Card:</label>
          <input
            type="text"
            name="creditcard"
            id="creditcard"
            placeholder="Enter credit card number"
          />
        </div>
        <div>
          <label for="PIN">PIN:</label>
          <input type="text" name="PIN" id="PIN" placeholder="Enter PIN" />
        </div>
        <div>
          <label for="addtionalNote">Addtional Note:</label><br />
          <textarea
            name="addtionalNote"
            id="addtionalNote"
            placeholder="Enter Addtional Note"
          ></textarea>
        </div>
        <div>
          <button>Sumit Order</button>
        </div>
      </form>
    </section>
  </body>
</html>
