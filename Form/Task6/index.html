<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 6</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="bodyofform">
      <div class="bodyofform1">
        <div class="img">
          <img src="doctor.png" alt="women" height="550px" width="400px" />
        </div>
        <div>
          <h1>Doctor Appointment Form</h1>
          <div class="forminfo">
            <label for="appointmentDate">Appointment Date</label>
            <input type="date" name="appointmentDate" id="appointmentDate" />
            <label for="appointmentTime">Appointment Date</label>
            <input type="time" name="appointmentTime" id="appointmentTime" />
            <label for="fullName">Full Name</label>
            <div class="name">
              <input
                type="text"
                name="fullName"
                id="fullName"
                placeholder="Enter   Full Name"
              />
              <input
                type="text"
                name="fullName"
                id="fullName"
                placeholder="Enter   Full Name"
              />
            </div>
            <label for="gender">Gender</label>
            <div>
              <span> Male </span>
              <input type="radio" name="gender" id="gender" />
              <span>Female </span>
              <input type="radio" name="gender" id="gender" />
            </div>
            <label for="phone">Phone</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="Enter  Phone"
            />
            <label for="address">Address</label>
            <input
              type="text"
              name="address"
              id="address"
              placeholder="Enter  Address"
            />
            <label for="yourquery">Your Query</label>
            <input
              type="text"
              name="yourquery"
              id="yourquery"
              placeholder="Enter  Your Query"
            />
            <label for="appointmentType">Appointment Type</label>
            <div>
              <p>Select which appointment type your require</p>
              <div>
                <input
                  type="checkbox"
                  name="cervixcheckup"
                  id="cervixcheckup"
                />
                <label for="cervixcheckup">Cervix Checkup</label>
              </div>
              <div>
                <input type="checkbox" name="heartcheckup" id="heartcheckup" />
                <label for="heartcheckup">Heart Checkup</label>
              </div>
              <div>
                <input type="checkbox" name="eyecheckup" id="eyecheckup" />
                <label for="eyecheckup">Eye Checkup</label>
              </div>
              <div>
                <input type="checkbox" name="hearinText" id="hearinText" />
                <label for="hearinText">Hearin Text</label>
              </div>
              <div>
                <button>Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
